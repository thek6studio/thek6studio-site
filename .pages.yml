# Editor setup for Pages CMS (app.pagescms.org).
# This decides which boxes you see when you edit the site. The design itself is in build.js and /design.

media:
  - name: images
    label: Images
    input: static/images
    output: /images
    extensions: [jpg, jpeg, png, webp, gif]
  - name: previews
    label: Preview PDFs
    input: static/previews
    output: /previews
    extensions: [pdf]

content:
  - name: products
    label: Shop – units for sale
    type: collection
    path: content/products
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, stage, price, hidden]
      primary: title
      sort: order
    fields:
      - { name: title, label: Unit name, type: string, required: true }
      - { name: description, label: Short description, type: text }
      - name: stage
        label: Stage
        type: select
        options: { values: [Early Stage 1, Stage 1, Stage 2, Stage 3] }
      - name: subject
        label: Subject
        type: select
        options: { values: [Creative Arts, HSIE, PDHPE, Science and Technology, English, Mathematics] }
      - { name: price, label: "Price as shown on the site (e.g. $14.00)", type: string }
      - { name: image, label: Cover image (landscape 16:9 works best), type: image, options: { media: images } }
      - { name: image_alt, label: Image description (for screen readers), type: string }
      - { name: payhip_key, label: "Payhip product link or key (e.g. https://payhip.com/b/AbC1)", type: string }
      - name: preview_images
        label: "Preview images (optional): pages teachers can flick through before buying"
        type: image
        options: { media: images, path: previews, multiple: { max: 10 } }
      - name: preview_pdf
        label: "Preview PDF (optional): opens in a new tab. Use a sample, not the full unit!"
        type: file
        options: { media: previews, extensions: [pdf] }
      - { name: other_link, label: "Optional: link to another store instead (used only if Payhip is empty)", type: string }
      - { name: other_link_label, label: "Optional: text for that button (e.g. View on TPT)", type: string }
      - { name: order, label: Position in the list (1 = first), type: number }
      - { name: hidden, label: Hide from the site, type: boolean }

  - name: samples
    label: Free samples
    type: collection
    path: content/samples
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, stage, hidden]
      primary: title
      sort: order
    fields:
      - { name: title, label: Unit name, type: string, required: true }
      - { name: topic, label: Topic (shown in italics), type: string }
      - name: stage
        label: Stage
        type: select
        options: { values: [Early Stage 1, Stage 1, Stage 2, Stage 3] }
      - name: subject
        label: Subject
        type: select
        options: { values: [Creative Arts, HSIE, PDHPE, Science and Technology, English, Mathematics] }
      - { name: image, label: Preview image (landscape 16:9), type: image, options: { media: images } }
      - { name: image_alt, label: Image description, type: string }
      - { name: payhip_key, label: "Payhip link for the free product (adds a 'Get it free' button)", type: string }
      - { name: order, label: Position (1 = first), type: number }
      - { name: hidden, label: Hide from the site, type: boolean }

  - name: home
    label: Home page text
    type: file
    path: content/home.json
    format: json
    fields:
      - name: hero
        label: Top of page
        type: object
        fields:
          - { name: heading, label: Big heading, type: text }
          - { name: intro, label: Intro sentence, type: text }
          - { name: primary_button, label: Coral button text, type: string }
          - { name: secondary_button, label: Outline button text, type: string }
      - name: free
        label: Free samples section
        type: object
        fields:
          - { name: label, label: Small label, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro, type: text }
          - { name: box_heading, label: White box heading, type: string }
          - { name: box_text, label: White box text, type: text }
          - { name: box_button, label: White box button text, type: string }
          - { name: box_link, label: "White box button link (leave empty to hide the button)", type: string }
      - name: resources
        label: Resources section
        type: object
        fields:
          - { name: label, label: Small label, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro, type: text }
          - { name: shop_heading, label: Heading above the units for sale, type: string }
      - name: subjects
        label: Subject cards
        type: object
        list: true
        fields:
          - { name: name, label: Subject, type: string }
          - name: icon
            label: Icon
            type: select
            options: { values: [palette, globe, heart, flask, book, numbers, pencil] }
          - name: colour
            label: Icon colour
            type: select
            options: { values: [coral, mustard, sage, aqua] }
          - { name: description, label: Description, type: text }
          - { name: link_label, label: Link text, type: string }
          - { name: link, label: Link address, type: string }
      - name: inside
        label: Inside every unit
        type: object
        fields:
          - { name: label, label: Small label, type: string }
          - { name: heading, label: Heading, type: string }
          - name: items
            label: Ticked items
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
      - name: about
        label: About section
        type: object
        fields:
          - { name: label, label: Small label, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: paragraphs, label: Paragraphs, type: text, list: true }
          - { name: note, label: Small note under the paragraphs (leave empty to hide), type: text }
          - { name: values, label: Lines in the pink card, type: string, list: true }
      - name: instagram
        label: Instagram band
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: string }
      - name: contact
        label: Contact section
        type: object
        fields:
          - { name: label, label: Small label, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro, type: text }

  - name: settings
    label: Site settings
    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: site_title, label: Site title (browser tab and Google), type: string }
      - { name: meta_description, label: Google description, type: text }
      - { name: brand_name, label: Name in the header, type: string }
      - { name: brand_tagline, label: Small line under the name, type: string }
      - { name: domain, label: Web address shown in the footer, type: string }
      - { name: email, label: Contact email, type: string }
      - { name: instagram_handle, label: Instagram handle (without @), type: string }
      - { name: cart_link, label: "Cart icon link (e.g. #shop once your units are listed)", type: string }
      - name: other_stores
        label: Other stores (buttons and contact card)
        type: object
        list: true
        fields:
          - { name: label, label: Store name, type: string }
          - { name: url, label: Link, type: string }
